apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-contributor
  namespace: bluefin-system
  labels:
    app.kubernetes.io/name: review-contributor
    app.kubernetes.io/component: contributor
    app.kubernetes.io/part-of: review
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: review-contributor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: review-contributor
        app.kubernetes.io/component: contributor
        app.kubernetes.io/part-of: review
    spec:
      serviceAccountName: review-contributor
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: contributor
          image: ghcr.io/projectbluefin/review:stable
          imagePullPolicy: Always
          env:
            - name: GOOSE_MODEL
              value: "gemini-3.8-flash"
            - name: GOOSE_THINKING_EFFORT
              value: "max"
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: review-contributor-secret
                  key: GH_TOKEN
                  optional: true
            - name: GITHUB_COPILOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: review-contributor-secret
                  key: GITHUB_COPILOT_TOKEN
                  optional: true
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: hive-config
              mountPath: /home/dev/.config/hive
            - name: hive-contributor-env
              mountPath: /home/dev/.config/hive/contributor.env
              subPath: contributor.env
              readOnly: true
            - name: workspace
              mountPath: /home/dev/workspace
          startupProbe:
            exec:
              command:
                - tmux
                - has-session
                - -t
                - contributor
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - tmux
                - has-session
                - -t
                - contributor
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - tmux
                - has-session
                - -t
                - contributor
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: hive-config
          emptyDir: {}
        - name: hive-contributor-env
          secret:
            secretName: review-contributor-secret
            defaultMode: 0440
            items:
              - key: contributor.env
                path: contributor.env
        - name: workspace
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: review-contributor
  namespace: bluefin-system
  labels:
    app.kubernetes.io/name: review-contributor
    app.kubernetes.io/component: contributor
    app.kubernetes.io/part-of: review
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: review-contributor
  namespace: bluefin-system
  labels:
    app.kubernetes.io/name: review-contributor
    app.kubernetes.io/component: contributor
    app.kubernetes.io/part-of: review
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: review-contributor
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 22
