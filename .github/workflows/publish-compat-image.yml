name: publish review image

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Branch builds are a moving pointer, so a superseded run has nothing left to
# publish and is cancelled. Tag builds are a release and must never be
# cancelled: 'refs/tags/*' evaluates this to false.
concurrency:
  group: publish-review-image-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  # 'artifact-metadata: write' lets actions/attest persist its storage record;
  # without it every attestation step warns and the record is dropped.
  artifact-metadata: write
  attestations: write
  contents: read
  id-token: write
  packages: write

# The toolchain is podman, buildah and skopeo -- the same engines the launcher
# runs and the audit measures with. Each architecture is built by a runner of
# that architecture and the published artifact is an OCI index assembled from
# those two digests, so no shipped layer is ever produced under emulation and
# every runtime claim comes from a container the runner could really execute.
env:
  IMAGE: ghcr.io/projectbluefin/review
  # Assembling and annotating an image index needs 'buildah manifest annotate
  # --index', which the runner's own buildah predates. Pinned by digest and
  # run unprivileged: manifest assembly moves descriptors, never layers.
  BUILDAH_IMAGE: quay.io/buildah/stable:v1.43@sha256:ca4edbaabf71ca330ec9b2714bf8e06c726a6e85ae215cfb1474d2e2c832aacb

jobs:
  resolve-goose:
    runs-on: ubuntu-latest
    outputs:
      x86_64_sha256: ${{ steps.goose.outputs.x86_64_sha256 }}
      aarch64_sha256: ${{ steps.goose.outputs.aarch64_sha256 }}
    steps:
      - name: Resolve official Goose canary asset identities
        id: goose
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release="$(gh api repos/aaif-goose/goose/releases/tags/canary)"
          asset_digest() {
            jq -er --arg name "$1" \
              '.assets[] | select(.name == $name) | .digest |
               select(test("^sha256:[0-9a-f]{64}$")) | ltrimstr("sha256:")' \
              <<<"$release"
          }
          {
            echo "x86_64_sha256=$(asset_digest goose-x86_64-unknown-linux-musl.tar.gz)"
            echo "aarch64_sha256=$(asset_digest goose-aarch64-unknown-linux-musl.tar.gz)"
          } >>"$GITHUB_OUTPUT"

  # One source of truth for every OCI value in this run. The native builds
  # stamp these as config labels and the index carries the identical set as
  # annotations, so 'created' has to be decided once, before either.
  metadata:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.metadata.outputs.created }}
      base_name: ${{ steps.metadata.outputs.base_name }}
      base_digest: ${{ steps.metadata.outputs.base_digest }}
      version: ${{ steps.metadata.outputs.version }}
      sha: ${{ steps.metadata.outputs.sha }}
      oci_version: ${{ steps.metadata.outputs.oci_version }}
      stable: ${{ steps.metadata.outputs.stable }}
      tags: ${{ steps.metadata.outputs.tags }}
      platforms: ${{ steps.metadata.outputs.platforms }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve image tags and OCI metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          # Two shapes, decided by the ref alone:
          #   refs/heads/main  every merge: both architectures, 'sha-<commit>'
          #                     + ':stable'
          #   refs/tags/v*     release: both architectures, version tags + ':stable'
          #   anything else    dispatch from a side branch: both architectures,
          #                     'sha-' only
          #
          # ':stable' moves on every merge on purpose. This is a development
          # tool whose contributors are the people changing it, so the tag
          # they run has to mean 'what the repository says now'. Publishing it
          # only on release tags is what left a contributor running days-old
          # code and hitting bugs that were already fixed on main.
          release=false
          main=false
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            release=true
          elif [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            main=true
          fi

          base_image="$(sed -n 's/^ARG FSDK_RUNNER_IMAGE=\(.*\)$/\1/p' image/Containerfile)"
          test -n "$base_image"
          test "${base_image#*@}" != "$base_image"

          version=""
          if [[ "$release" == true ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi

          {
            printf 'created=%s\n' "$(date --utc +%Y-%m-%dT%H:%M:%SZ)"
            printf 'base_name=%s\n' "${base_image%@*}"
            printf 'base_digest=%s\n' "${base_image#*@}"
            echo "sha=sha-${GITHUB_SHA}"
            printf 'version=%s\n' "$version"
            printf 'oci_version=%s\n' "${version:-sha-${GITHUB_SHA}}"
            if [[ "$release" == true ]]; then
              echo 'stable=true'
            else
              printf 'stable=%s\n' "$main"
            fi
            # Every published index is a complete contributor artifact: both
            # native platforms, whatever the ref. Stable is the launcher
            # default and is never anything less.
            echo 'platforms=linux/amd64,linux/arm64'
            # Space-separated on one line: a tag cannot contain a space, and a
            # single-line job output cannot be truncated between jobs.
            tags="${IMAGE}:sha-${GITHUB_SHA}"
            if [[ "$release" == true ]]; then
              tags+=" ${IMAGE}:${version} ${IMAGE}:${GITHUB_REF_NAME}"
            fi
            if [[ "$release" == true || "$main" == true ]]; then
              tags+=" ${IMAGE}:stable"
            fi
            printf 'tags=%s\n' "$tags"
          } >> "$GITHUB_OUTPUT"

  # One job per architecture, each on a runner of that architecture. Nothing
  # is cross-built: the runner's own CPU produces the layers, runs the smoke
  # checks, and the audit measures a container it can actually execute.
  build:
    needs: [resolve-goose, metadata]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            uname: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            uname: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prove the native host and record the container toolchain
        shell: bash
        env:
          EXPECTED_UNAME: ${{ matrix.uname }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          host_arch="$(uname -m)"
          test "$host_arch" = "$EXPECTED_UNAME" ||
            { echo "native ${EXPECTED_UNAME} host required, got ${host_arch}" >&2; exit 1; }
          # Runner images are mutable, so record what actually shipped instead
          # of assuming a version.
          podman --version
          buildah --version
          skopeo --version
          engine_arch="$(podman info --format '{{.Host.Arch}}')"
          test "$engine_arch" = "$EXPECTED_ARCH" ||
            { echo "native ${EXPECTED_ARCH} engine required, got ${engine_arch}" >&2; exit 1; }
          echo "Native host: ${host_arch}; podman engine: ${engine_arch}"

      - name: Build the review image
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOSE_X86_64_SHA256: ${{ needs.resolve-goose.outputs.x86_64_sha256 }}
          GOOSE_AARCH64_SHA256: ${{ needs.resolve-goose.outputs.aarch64_sha256 }}
          CREATED: ${{ needs.metadata.outputs.created }}
          BASE_NAME: ${{ needs.metadata.outputs.base_name }}
          BASE_DIGEST: ${{ needs.metadata.outputs.base_digest }}
          OCI_VERSION: ${{ needs.metadata.outputs.oci_version }}
        run: |
          set -euo pipefail
          # The runner's podman predates '--secret id=NAME,env=VAR', so the
          # token reaches the build as a file only this job can read. It is
          # never a build-arg and never lands in a layer.
          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file"' EXIT
          chmod 0600 "$secret_file"
          printf '%s' "$GITHUB_TOKEN" > "$secret_file"
          podman build \
            --format oci \
            --build-arg GOOSE_REFRESH="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --build-arg GOOSE_X86_64_SHA256="$GOOSE_X86_64_SHA256" \
            --build-arg GOOSE_AARCH64_SHA256="$GOOSE_AARCH64_SHA256" \
            --secret id=github_token,src="$secret_file" \
            --label "org.opencontainers.image.title=Bluefin review contributor" \
            --label "org.opencontainers.image.description=Foreground contributor runtime for projectbluefin/review." \
            --label "org.opencontainers.image.url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${OCI_VERSION}" \
            --label "org.opencontainers.image.created=${CREATED}" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            --label "org.opencontainers.image.base.name=${BASE_NAME}" \
            --label "org.opencontainers.image.base.digest=${BASE_DIGEST}" \
            --file image/Containerfile \
            --tag review:smoke \
            .

      - name: Inspect the review image
        shell: bash
        run: |
          set -euo pipefail
          test "$(podman image inspect review:smoke --format '{{.Config.User}}')" = dev
          test "$(podman image inspect review:smoke --format '{{json .Config.Entrypoint}}')" = '["/usr/local/bin/review-entrypoint"]'
          # /home/dev, not /workspace: there is no workspace mount any more.
          test "$(podman image inspect review:smoke --format '{{.Config.WorkingDir}}')" = /home/dev
          # OCI, not Docker schema 2. The launcher, the registry and the audit
          # all treat OCI as the shipped format.
          test "$(podman image inspect review:smoke --format '{{.ManifestType}}')" = application/vnd.oci.image.manifest.v1+json
          # The lean FSDK base has no terminal database. The entrypoint needs
          # the 256color attach entry and panes run the direct-color entry.
          podman run --rm --entrypoint /usr/bin/bash review:smoke \
            -lc 'TERM=xterm-256color infocmp xterm-256color >/dev/null; infocmp tmux-direct >/dev/null; TERM=xterm-256color tmux new-session -d -s terminfo-smoke "sleep 30"; tmux has-session -t terminfo-smoke; test "$(tmux show -gv default-terminal)" = tmux-direct; tmux kill-session -t terminfo-smoke'

      - name: Prove the shipped runtime on this architecture
        shell: bash
        env:
          EXPECTED_UNAME: ${{ matrix.uname }}
        run: |
          set -euo pipefail
          container_arch="$(podman run --rm --entrypoint /usr/bin/uname review:smoke -m)"
          test "$container_arch" = "$EXPECTED_UNAME"
          podman run --rm --entrypoint /usr/local/bin/codex review:smoke --version
          podman run --rm --entrypoint /usr/local/bin/codex-code-mode-host review:smoke --help
          podman run --rm --entrypoint /opt/bluefin/tui/.venv/bin/python review:smoke \
            -c "import sys; sys.path.insert(0, '/opt/bluefin/tui'); import bluefin_review_tui"
          echo "Native container: ${container_arch}"

      - name: Log in to GHCR
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Two consumers, two explicit paths, no reliance on lookup order.
          # podman gets an authfile it is told about by name; actions/attest
          # reads ~/.docker/config.json and nothing else, which is why writing
          # only podman's own default location left the attest steps with
          # "No credentials found for registry ghcr.io".
          mkdir -p "${HOME}/.docker"
          for authfile in "${RUNNER_TEMP}/ghcr-auth.json" "${HOME}/.docker/config.json"; do
            printf '%s' "$GITHUB_TOKEN" |
              podman login ghcr.io --username "${GITHUB_ACTOR}" \
                --authfile "$authfile" --password-stdin
            chmod 0600 "$authfile"
          done

      - name: Push the per-architecture image
        id: push
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          # Staged into this repository's own namespace, not the release one:
          # a fork builds and proves the image with its own token, and only
          # the guarded publish job — which runs solely on the canonical
          # repository, where these two are the same registry path — turns
          # those digests into ':stable'. GHCR paths are lowercase.
          staging="ghcr.io/${GITHUB_REPOSITORY,,}"
          target="${staging}:sha-${GITHUB_SHA}-${ARCH}"
          podman push --format oci --authfile "${RUNNER_TEMP}/ghcr-auth.json" \
            --digestfile "${RUNNER_TEMP}/digest-${ARCH}.txt" \
            review:smoke "docker://${target}"
          digest="$(cat "${RUNNER_TEMP}/digest-${ARCH}.txt")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "digest=${digest}"
            echo "image=${staging}"
          } >> "$GITHUB_OUTPUT"
          echo "Pushed ${target}@${digest}"

      # Matrix jobs share one output namespace and overwrite each other, so
      # the digests travel to the publish job as artifacts instead.
      - name: Publish the digest for index assembly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 1

      # The SBOM is generated here, on the architecture it describes. Scanning
      # the multi-architecture index instead would silently produce one
      # platform's inventory and attach it to an artifact claiming both.
      - name: Generate the SPDX SBOM for this architecture
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.push.outputs.image }}@${{ steps.push.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: review-sbom-${{ matrix.arch }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance for this architecture
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest the SPDX SBOM for this architecture
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: review-sbom-${{ matrix.arch }}.spdx.json
          push-to-registry: true

      - name: Verify pinned FSDK input provenance and native platforms
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash tests/image-audit.sh --verify-base-evidence

      - name: Audit the native image and record evidence
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          DERIVED_IMAGE: ${{ steps.push.outputs.image }}@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          bash tests/image-audit.sh --derived "$DERIVED_IMAGE" \
            --report "$RUNNER_TEMP/review-image-audit-${ARCH}.md"
          cat "$RUNNER_TEMP/review-image-audit-${ARCH}.md" >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: github.repository == 'projectbluefin/review'
    needs: [build, metadata]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Record the container toolchain
        shell: bash
        run: |
          set -euo pipefail
          # Runner images are mutable. A missing tool fails here, with its own
          # name in the log, rather than inside the audit that needed it.
          podman --version
          skopeo --version
          gh --version

      - name: Collect the native per-architecture digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: review-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Log in to GHCR
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Two consumers, two explicit paths: the buildah container gets the
          # first file read-only, and actions/attest reads
          # ~/.docker/config.json and nothing else.
          mkdir -p "${HOME}/.docker"
          for authfile in "${RUNNER_TEMP}/ghcr-auth.json" "${HOME}/.docker/config.json"; do
            printf '%s' "$GITHUB_TOKEN" |
              podman login ghcr.io --username "${GITHUB_ACTOR}" \
                --authfile "$authfile" --password-stdin
            chmod 0600 "$authfile"
          done

      - name: Publish the multi-architecture index
        id: publish
        shell: bash
        env:
          TAGS: ${{ needs.metadata.outputs.tags }}
          CREATED: ${{ needs.metadata.outputs.created }}
          BASE_NAME: ${{ needs.metadata.outputs.base_name }}
          BASE_DIGEST: ${{ needs.metadata.outputs.base_digest }}
          OCI_VERSION: ${{ needs.metadata.outputs.oci_version }}
          TITLE: Bluefin review contributor
          DESCRIPTION: Foreground contributor runtime for projectbluefin/review.
        run: |
          set -euo pipefail
          AMD64_DIGEST="$(cat "${RUNNER_TEMP}/digests/digest-amd64.txt")"
          ARM64_DIGEST="$(cat "${RUNNER_TEMP}/digests/digest-arm64.txt")"
          [[ "$AMD64_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$ARM64_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          # buildah keys index entries by digest, so two identical digests
          # collapse into one entry and '--arch' silently relabels it: the
          # index would claim one platform, not both. That can only happen if
          # the matrix collected the same architecture twice.
          [[ "$AMD64_DIGEST" != "$ARM64_DIGEST" ]] ||
            { echo "both architectures reported the same digest: ${AMD64_DIGEST}" >&2; exit 1; }
          export AMD64_DIGEST ARM64_DIGEST
          # The per-architecture manifests were staged in this repository's own
          # namespace by the build jobs. This job only runs on the canonical
          # repository, so that path and the release path are the same, but
          # naming it explicitly keeps the reference honest.
          STAGING="ghcr.io/${GITHUB_REPOSITORY,,}"
          SOURCE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          export STAGING SOURCE_URL

          mkdir -p "${RUNNER_TEMP}/index-out"
          # Values reach buildah through the environment, never through a
          # generated script: the index annotations are free text and quoting
          # them into a shell fragment is how a title becomes a command.
          podman run --rm \
            --env STAGING --env AMD64_DIGEST --env ARM64_DIGEST --env TAGS \
            --env TITLE --env DESCRIPTION --env SOURCE_URL --env GITHUB_SHA \
            --env OCI_VERSION --env CREATED --env BASE_NAME --env BASE_DIGEST \
            --volume "${RUNNER_TEMP}/ghcr-auth.json:/run/ghcr-auth.json:ro,z" \
            --volume "${RUNNER_TEMP}/index-out:/run/out:z" \
            --entrypoint /bin/bash \
            "$BUILDAH_IMAGE" -euo pipefail -c '
              buildah manifest create review:index
              for entry in "amd64:${AMD64_DIGEST}" "arm64:${ARM64_DIGEST}"; do
                buildah manifest add \
                  --authfile /run/ghcr-auth.json \
                  --arch "${entry%%:*}" --os linux \
                  review:index "docker://${STAGING}@${entry#*:}"
              done
              buildah manifest annotate --index \
                --annotation "org.opencontainers.image.title=${TITLE}" \
                --annotation "org.opencontainers.image.description=${DESCRIPTION}" \
                --annotation "org.opencontainers.image.url=${SOURCE_URL}" \
                --annotation "org.opencontainers.image.source=${SOURCE_URL}" \
                --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
                --annotation "org.opencontainers.image.version=${OCI_VERSION}" \
                --annotation "org.opencontainers.image.created=${CREATED}" \
                --annotation "org.opencontainers.image.licenses=Apache-2.0" \
                --annotation "org.opencontainers.image.base.name=${BASE_NAME}" \
                --annotation "org.opencontainers.image.base.digest=${BASE_DIGEST}" \
                review:index
              # Every tag names the same index digest. "--all" stays off: the
              # platform manifests are already in this repository, pushed by
              # the native build jobs, so only the index needs uploading.
              for tag in $TAGS; do
                buildah manifest push \
                  --authfile /run/ghcr-auth.json \
                  --format oci \
                  --digestfile /run/out/index-digest.txt \
                  review:index "docker://${tag}"
                echo "Published ${tag}"
              done
            '

          digest="$(cat "${RUNNER_TEMP}/index-out/index-digest.txt")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Published index ${IMAGE}@${digest}"

      # The provenance covers the index: it is the artifact the launcher
      # resolves from a tag, and this workflow is what produced it. Each
      # platform image already carries its own provenance and its own SBOM,
      # attested by the native job that built and scanned it.
      - name: Attest build provenance for the published index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Audit published image composition and attestations
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DERIVED_IMAGE: ${{ env.IMAGE }}@${{ steps.publish.outputs.digest }}
          EXPECTED_VERSION: ${{ needs.metadata.outputs.oci_version }}
        run: |
          set -euo pipefail
          bash tests/image-audit.sh \
            --derived "$DERIVED_IMAGE" \
            --require-oci \
            --require-attestations \
            --require-github-attestation \
            --attestation-repository "${GITHUB_REPOSITORY}" \
            --expected-source "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --expected-revision "${GITHUB_SHA}" \
            --expected-version "$EXPECTED_VERSION"

      - name: Verify published digest
        shell: bash
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          SHA_TAG: ${{ needs.metadata.outputs.sha }}
          VERSION: ${{ needs.metadata.outputs.version }}
          STABLE: ${{ needs.metadata.outputs.stable }}
          PLATFORMS: ${{ needs.metadata.outputs.platforms }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          echo "Published $IMAGE@$DIGEST"
          {
            echo "### Review image"
            echo
            echo "\`$IMAGE@$DIGEST\`"
            echo
            echo "Immutable tag: \`$IMAGE:${SHA_TAG}\`"
            echo "Platforms: \`${PLATFORMS}\`, each built on a runner of that architecture"
            if [[ -n "$VERSION" ]]; then
              echo "Version tag: \`$IMAGE:${VERSION}\`"
            fi
            if [[ "$STABLE" == true ]]; then
              echo "Stable alias: \`$IMAGE:stable\` now points at this build"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
