name: update PR queue

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [renovate-completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: update-pr-queue
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Validate queue generator
        run: node --test queue/test/queue.test.mjs

      - name: Generate static queue artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_OWNER: projectbluefin
          QUEUE_REPOSITORIES: >-
            actions,bluefin,bluefinctl,bluefin-lts,bluefin-mcp,bluespeed,
            bonedigger,branding,common,dakota,documentation,finpilot,
            fsdk-containers,.github,homebrew-bluefinctl,housekeeping,iso,
            knuckle,lab,.project,renovate-config,review,server,testsuite,
            umotd,uwelcome,website
        run: node queue/generate.mjs

      - name: Upload queue artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy queue artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
