name: validate

# justfile is the shipped launcher. This workflow validates
# its Bash syntax, image contract, compatibility image, and mocked attended
# selection flow without requiring a live Hive account or interactive terminal.

on:
  push:
  pull_request:

permissions:
  attestations: read
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install image audit tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes skopeo

      - name: Verify pinned FSDK input provenance and native platforms
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash tests/image-audit.sh --verify-base-evidence

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'

      # pre-commit/action is maintenance-only upstream, so run pre-commit
      # directly instead.
      - name: Static hygiene
        run: |
          set -euo pipefail
          python -m pip install --upgrade pre-commit
          pre-commit run --all-files --show-diff-on-failure
          pre-commit run shellcheck --hook-stage manual --all-files --show-diff-on-failure

      - name: Skill frontmatter valid and generated index fresh
        run: |
          set -euo pipefail
          bash scripts/check-skill-frontmatter.sh

      - name: Skill generator rejects unsafe manifest paths
        run: |
          set -euo pipefail
          bash tests/generate-skills.sh

      - name: Harness registry and adapter contracts
        run: |
          set -euo pipefail
          python3 tests/harness-contract.py

      - name: PR queue generator contract
        run: |
          set -euo pipefail
          node --test queue/test/queue.test.mjs

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Justfile parses
        run: |
          set -euo pipefail
          just --justfile justfile --list

      - name: Guided Goose onboarding behavior
        run: |
          set -euo pipefail
          bash tests/just-onboarding.sh

      - name: Recipe bodies are valid bash
        run: |
          set -euo pipefail
          # Recipe headers in this file look like 'review:',
          # 'review-doctor:' — a bare identifier + colon at column 0,
          # no parameters. Grab every indented line following one, until the
          # next non-indented, non-comment, non-blank line (next recipe or
          # variable declaration).
          awk '
            /^[a-zA-Z][a-zA-Z0-9_-]*:$/ { flag=1; next }
            /^[^ \t#]/ { flag=0 }
            flag { print }
          ' justfile > recipe_bodies.sh
          bash -n recipe_bodies.sh
          rm -f recipe_bodies.sh

      - name: Image contract — Containerfile, config, entrypoint, shims, hooks
        env:
          # Lets the contract's upstream Hive drift check reach the API. It
          # degrades to a notice without this, so the step never depends on it.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash tests/image-contract.sh
          bash tests/hive-compatibility.sh
          bash tests/bluefin-review.sh
          bash tests/worktree-guard.sh

      # Drives the real Textual app: builds the hash-locked Textual venv from
      # image/tui/requirements.lock, then presses keys and asserts what the
      # maintainer is told. Separate from the step above because it installs.
      - name: Dashboard contract and pilot
        run: |
          set -euo pipefail
          bash tests/dashboard-contract.sh

      - name: Interactive launcher docs and shell stay aligned
        run: |
          set -euo pipefail
          # The sed and grep patterns intentionally contain literal
          # dollar-sign syntax for the embedded shell checks.
          # shellcheck disable=SC2016
          HIVE_PIN="$(sed -n 's/^hive_commit := "\(.*\)"$/\1/p' justfile)"
          test -n "$HIVE_PIN"
          IMAGE_HIVE_PIN="$(sed -n 's/^ARG HIVE_COMMIT=\([0-9a-f]\{40\}\)$/\1/p' image/Containerfile)"
          test "$HIVE_PIN" = "$IMAGE_HIVE_PIN"
          grep -Fq 'gpt-5.6-luna' justfile
          grep -Fq 'require_copilot_provider' justfile
          # shellcheck disable=SC2016
          grep -Fq 'fetch --depth 1 origin "$HIVE_COMMIT"' justfile
          grep -Fq 'REVIEW_HIVE_COMMIT' justfile
          grep -Fq 'Run: goose configure' justfile
          grep -Fq "$HIVE_PIN" README.md
          grep -Fq 'REVIEW_HIVE_COMMIT' README.md
          grep -Fq 'gpt-5.6-luna' README.md
          grep -Fq 'github_copilot' README.md

      - name: Resolve official Goose canary asset identities
        id: goose
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release="$(gh api repos/aaif-goose/goose/releases/tags/canary)"
          asset_digest() {
            jq -er --arg name "$1" \
              '.assets[] | select(.name == $name) | .digest |
               select(test("^sha256:[0-9a-f]{64}$")) | ltrimstr("sha256:")' \
              <<<"$release"
          }
          {
            echo "x86_64_sha256=$(asset_digest goose-x86_64-unknown-linux-musl.tar.gz)"
            echo "aarch64_sha256=$(asset_digest goose-aarch64-unknown-linux-musl.tar.gz)"
          } >>"$GITHUB_OUTPUT"

      - name: Compatibility image contract and build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker build \
            --build-arg GOOSE_X86_64_SHA256="${{ steps.goose.outputs.x86_64_sha256 }}" \
            --build-arg GOOSE_AARCH64_SHA256="${{ steps.goose.outputs.aarch64_sha256 }}" \
            --secret id=github_token,env=GITHUB_TOKEN \
            -f image/Containerfile -t review:test .
          test "$(docker inspect review:test --format '{{.Config.User}}')" = "dev"
          test "$(docker inspect review:test --format '{{json .Config.Entrypoint}}')" = '["/usr/local/bin/review-entrypoint"]'
          # /home/dev, not /workspace: there is no workspace mount any more —
          # the agent clones what it needs inside the disposable container, and
          # Hive's config lives under the image's home.
          test "$(docker inspect review:test --format '{{.Config.WorkingDir}}')" = "/home/dev"

      - name: Audit exact FSDK and built review image
        run: |
          set -euo pipefail
          bash tests/image-audit.sh --derived review:test

      # The launcher is interactive by design. CI validates image metadata and
      # the native build-host runtime. Cross-platform runtime evidence is
      # deliberately unavailable here rather than being claimed from QEMU.
