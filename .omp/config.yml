# Project settings for projectbluefin/review development.
#
# The interactive model remains the user's choice through /model. Repository
# subagents select semantic roles so the active routing profile owns concrete
# provider/model choices; this file is not copied into either runtime image.
#
# Deliberately absent: modelRoles.default. The model *you* drive is yours to
# choose; these settings apply only to agents spawned while working in this repo.
task:
  agentModelOverrides:
    scout: "@fast"
    sonic: "@fast"
    task: "@general"
    reviewer: "@review"
    security-reviewer: "@review"
    bluefin-doctrine: "@review"
    bluefin-ci-triage: "@fast"
    bluefin-correctness: "@review"
    bluefin-security: "@review"
    bluefin-test-coverage: "@review"
    bluefin-simplicity: "@review"
    bluefin-reviewer: "@review"
    bluefin-queue-triage: "@review"
modelRoles:
  fast: github-copilot/gemini-3.8-flash
  general: github-copilot/gemini-3.8-flash
  review: github-copilot/gemini-3.8-flash:high
  final: github-copilot/kimi-k3:max
  advisor: "@default"
advisor:
  syncBacklog: 1
